<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✦ Player Roxo • MP3 Interno ✦</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== RESET + ESTRELAS (CANVAS) ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
      body {
    background: #0b0710;
    height: 100vh;
    width: 100vw;
    overflow: hidden; /* pode manter */
    position: relative;
}


        canvas#starfield { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        
        /* ===== CONTEÚDO PRINCIPAL – VIDRO ROXO ===== */
        .content { position: relative; z-index: 2; width: 100%; height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(2px); }
        .player-card { width: 1200px; max-width: 98vw; height: 800px; max-height: 90vh; background: rgba(25, 10, 35, 0.55); backdrop-filter: blur(16px); border: 1px solid rgba(200, 130, 255, 0.3); border-radius: 48px; box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 0 2px rgba(180,0,255,0.1) inset, 0 0 30px #9a4dff55; display: flex; flex-direction: column; padding: 30px; color: #f0e6ff; }
        
        /* ----- CABEÇALHO ----- */
        .player-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(170,90,255,0.4); }
        .player-header h1 { font-size: 2rem; font-weight: 600; background: linear-gradient(135deg, #e9b6ff, #c77dff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; text-shadow: 0 0 8px #b742ff; }
        .player-header h1 i { -webkit-text-fill-color: initial; color: #f2d4ff; text-shadow: 0 0 12px #bf6aff; margin-right: 8px; }
        .btn-pasta { background: rgba(80,20,120,0.7); border: 1.5px solid #c08aff; color: #f3e5ff; padding: 12px 24px; border-radius: 60px; font-size: 1.1rem; font-weight: 600; backdrop-filter: blur(8px); box-shadow: 0 0 15px #b76eff77; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.2s; }
        .btn-pasta:hover { background: #7b2eb3; border-color: #e6b3ff; box-shadow: 0 0 25px #cf8eff; transform: scale(1.02); }
        #fileInput { display: none; } /* input de arquivos múltiplos */
        
        /* ----- CORPO PRINCIPAL (player + playlist) ----- */
        .main-area { display: flex; flex: 1; gap: 30px; min-height: 0; }
        .player-left { flex: 1.1; display: flex; flex-direction: column; background: rgba(15,5,25,0.45); border-radius: 36px; padding: 25px; backdrop-filter: blur(10px); border: 1px solid #a848ff55; box-shadow: 0 10px 30px #1a0a1f; }
        .vinyl-area { display: flex; justify-content: center; align-items: center; margin-bottom: 20px; }
        .vinyl { width: 200px; height: 200px; background: radial-gradient(circle at 30% 30%, #2a1a3a, #0b0510); border-radius: 50%; box-shadow: 0 0 0 8px #301545, 0 0 0 12px #1e0d25, 0 20px 40px black; display: flex; justify-content: center; align-items: center; position: relative; transition: box-shadow 0.3s; }
        .vinyl::after { content: "♫"; font-size: 64px; color: rgba(255,210,255,0.9); text-shadow: 0 0 20px #ffa0ff, 0 0 40px #b300ff; background: rgba(25,0,35,0.7); width: 90px; height: 90px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px dashed #f0c0ff; }
        .vinyl.playing { animation: spin 8s linear infinite; box-shadow: 0 0 0 8px #6a1f9a, 0 0 0 12px #3c1a4a, 0 0 50px #d58aff; }
        @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
        .music-info { text-align: center; margin: 15px 0 10px; }
        .song-title { font-size: 1.8rem; font-weight: 700; color: #ffe6ff; text-shadow: 0 0 8px #bb5eff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-artist { font-size: 1.1rem; color: #d9b0ff; margin-top: 5px; opacity: 0.9; }
        .progress-area { margin: 15px 0 10px; }
        .time-row { display: flex; justify-content: space-between; font-size: 0.95rem; color: #ccb3ff; margin-bottom: 6px; }
        .progress-slider { width: 100%; accent-color: #c26eff; height: 8px; border-radius: 20px; background: #331144; box-shadow: inset 0 0 5px #1a0a1f; }
        .progress-slider::-webkit-slider-thumb { background: white; box-shadow: 0 0 15px #e79dff; width: 18px; height: 18px; border-radius: 50%; border: 2px solid #b300ff; }
        .control-buttons { display: flex; justify-content: center; align-items: center; gap: 30px; margin: 20px 0; }
        .control-btn { background: rgba(60,20,80,0.7); border: none; color: #f6e6ff; font-size: 1.8rem; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); border: 1px solid #c17aff; box-shadow: 0 0 15px #992eff55; transition: 0.15s; cursor: pointer; }
        .control-btn:hover { background: #902eff; color: white; border-color: #fad2ff; box-shadow: 0 0 30px #ca7eff; transform: scale(1.1); }
        .volume-box { display: flex; align-items: center; gap: 12px; margin-top: 8px; color: #e1baff; }
        .volume-slider { flex: 1; accent-color: #bc6eff; height: 6px; }
        
        /* ----- PLAYLIST ----- */
.playlist-right {
    flex: 0.9;
    background: rgba(20,6,30,0.6);
    backdrop-filter: blur(16px);
    border-radius: 32px;
    padding: 20px;
    border: 1px solid #b26bff55;
    display: flex;
    flex-direction: column;
    min-height: 0;  /* ← ADICIONE ISSO */
}
        .playlist-right h2 { font-size: 1.8rem; font-weight: 500; color: #efd6ff; border-bottom: 2px solid #b45eff; padding-bottom: 12px; margin-bottom: 16px; display: flex; gap: 10px; align-items: center; }
.playlist {
    list-style: none;
    overflow-y: auto;
    padding-right: 6px;
    flex: 1;
    min-height: 0;  /* ← ADICIONE */
}
        .playlist li { background: rgba(42,12,64,0.45); margin-bottom: 12px; padding: 14px 18px; border-radius: 40px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #b368ff33; backdrop-filter: blur(5px); transition: 0.15s; color: #eedbff; font-weight: 500; cursor: pointer; }
        .playlist li:hover { background: #6a2a9a; border-color: #f3bbff; box-shadow: 0 0 18px #c97bff; transform: translateX(6px); }
        .playlist li.active { background: linear-gradient(145deg, #8f3cc2, #632a82); border: 2px solid #ffc4ff; box-shadow: 0 0 25px #d48aff; color: white; }
        .song-name { font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
        .song-duration { background: #1e0b2c; padding: 6px 12px; border-radius: 40px; font-size: 0.9rem; color: #eacaff; }
        .empty-playlist { color: #be9ed6; text-align: center; margin-top: 40px; font-size: 1.3rem; font-style: italic; }
        .playlist::-webkit-scrollbar { width: 8px; }
        .playlist::-webkit-scrollbar-track { background: #1f0a2b; border-radius: 20px; }
        .playlist::-webkit-scrollbar-thumb { background: #b245ff; border-radius: 20px; border: 1px solid #ffb6ff; }
        
        @media (max-width: 900px) {
            .main-area { flex-direction: column; }
            .player-card { height: auto; max-height: 98vh; }
            .vinyl { width: 150px; height: 150px; }
        }
    </style>
</head>
<body>
    <canvas id="starfield"></canvas>
    <div class="content">
        <div class="player-card">
            <div class="player-header">
                <h1><i class="fas fa-meteor"></i> Lari's Playlist</h1>
                <!-- Botão para selecionar múltiplos MP3s (funciona no mobile) -->
                <input type="file" id="fileInput" multiple accept=".mp3,audio/mpeg">
            </div>
            <div class="main-area">
                <div class="player-left">
                    <div class="vinyl-area">
                        <div class="vinyl" id="vinylDisc"></div>
                    </div>
                    <div class="music-info">
                        <div class="song-title" id="currentSongTitle">Nenhuma música</div>
                        <div class="song-artist" id="currentSongArtist">✦ aguardando ✦</div>
                    </div>
                    <div class="progress-area">
                        <div class="time-row">
                            <span id="currentTime">0:00</span>
                            <span id="durationTime">0:00</span>
                        </div>
                        <input type="range" id="progressBar" class="progress-slider" value="0" min="0" max="100" step="0.1">
                    </div>
                    <div class="control-buttons">
                        <button class="control-btn" id="prevBtn"><i class="fas fa-backward"></i></button>
                        <button class="control-btn" id="playPauseBtn"><i class="fas fa-play"></i></button>
                        <button class="control-btn" id="nextBtn"><i class="fas fa-forward"></i></button>
                    </div>
                    <div class="volume-box">
                        <i class="fas fa-volume-up" style="color: #e6b3ff;"></i>
                        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.7">
                    </div>
                </div>
                <div class="playlist-right">
                    <h2><i class="fas fa-list-ul"></i> Playlist</h2>
                    <ul class="playlist" id="playlistContainer">
                        <li class="empty-playlist"><i class="fas fa-compact-disc"></i> Aguardando músicas...</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <script src="musicas/lista.js"></script>
    <script>
        (function() {
            "use strict";

            // ---------- ESTRELAS BRILHANTES (canvas) ----------
            const canvas = document.getElementById('starfield');
            const ctx = canvas.getContext('2d');
            let stars = [];
            const STAR_COUNT = 350;

            function initStars() {
                stars = [];
                for (let i = 0; i < STAR_COUNT; i++) {
                    stars.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        radius: Math.random() * 2.2 + 0.6,
                        speed: Math.random() * 0.04 + 0.01,
                        brightness: Math.random() * 0.7 + 0.3,
                        direction: Math.random() > 0.5 ? 1 : -1
                    });
                }
            }

            function drawStars() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let s of stars) {
                    s.brightness += s.speed * s.direction;
                    if (s.brightness > 1) {
                        s.brightness = 1;
                        s.direction = -1;
                    } else if (s.brightness < 0.3) {
                        s.brightness = 0.3;
                        s.direction = 1;
                    }
                    ctx.globalAlpha = s.brightness * 0.9;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 220, 255, ${s.brightness})`;
                    ctx.shadowColor = '#e9b3ff';
                    ctx.shadowBlur = s.radius * 3;
                    ctx.fill();
                }
                ctx.shadowBlur = 0;
                requestAnimationFrame(drawStars);
            }

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                initStars();
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            requestAnimationFrame(drawStars);

            // ---------- PLAYER ----------
            // Elementos DOM
            const fileInput = document.getElementById('fileInput');
            const playlistEl = document.getElementById('playlistContainer');
            const playPauseBtn = document.getElementById('playPauseBtn');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const progressBar = document.getElementById('progressBar');
            const volumeSlider = document.getElementById('volumeSlider');
            const currentTimeEl = document.getElementById('currentTime');
            const durationTimeEl = document.getElementById('durationTime');
            const songTitleEl = document.getElementById('currentSongTitle');
            const songArtistEl = document.getElementById('currentSongArtist');
            const vinylDisc = document.getElementById('vinylDisc');

            // Estado do player
            let playlist = [];
            let currentIndex = -1;
            const audio = new Audio();
            let isPlaying = false;

            // Utilitários
            function formatTime(seconds) {
                if (isNaN(seconds) || !isFinite(seconds)) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }

            function beautifyName(filename) {
                return filename.replace(/\.mp3$/i, '').replace(/[_-]/g, ' ');
            }

            // ---------- ADICIONAR MÚSICAS VIA SELEÇÃO MANUAL ----------
            function addFilesFromPicker(fileList) {
                // Revoga URLs antigas (apenas para itens que são blob)
                playlist.forEach(item => {
                    if (item.url && item.url.startsWith('blob:')) {
                        URL.revokeObjectURL(item.url);
                    }
                });

                playlist = [];
                playlistEl.innerHTML = '';

                const mp3Files = Array.from(fileList).filter(f => f.name.toLowerCase().endsWith('.mp3'));
                if (mp3Files.length === 0) {
                    playlistEl.innerHTML = '<li class="empty-playlist"><i class="fas fa-music"></i> Nenhum MP3 encontrado.</li>';
                    return;
                }

                mp3Files.sort((a,b) => a.name.localeCompare(b.name));

                mp3Files.forEach((file, idx) => {
                    const url = URL.createObjectURL(file);
                    const songName = beautifyName(file.name);
                    const item = {
                        name: songName,
                        url: url,
                        duration: 0,
                        durationStr: '0:00',
                        isBlob: true
                    };
                    playlist.push(item);
                    addPlaylistItem(idx, item);
                    loadMetadataForItem(item, idx);
                });

                if (playlist.length > 0) {
                    currentIndex = 0;
                    loadSongMetadata(0);
                    highlightActiveSong(0);
                }
            }

            // ---------- ADICIONAR MÚSICAS DA PASTA INTERNA (Cordova) ----------
            function addInternalEntries(entries) {
                playlist = [];
                playlistEl.innerHTML = '';

                const mp3Entries = entries.filter(e => e.name.toLowerCase().endsWith('.mp3'));
                if (mp3Entries.length === 0) {
                    playlistEl.innerHTML = '<li class="empty-playlist"><i class="fas fa-music"></i> Nenhum MP3 na pasta.</li>';
                    return;
                }

                mp3Entries.sort((a,b) => a.name.localeCompare(b.name));

                mp3Entries.forEach((entry, idx) => {
                    // URL nativa do Cordova (cdvfile:// ou file://) – funciona direto no <audio>
                    const url = entry.toURL();
                    const songName = beautifyName(entry.name);
                    const item = {
                        name: songName,
                        url: url,
                        duration: 0,
                        durationStr: '0:00',
                        isInternal: true
                    };
                    playlist.push(item);
                    addPlaylistItem(idx, item);
                    loadMetadataForItem(item, idx);
                });

                if (playlist.length > 0) {
                    currentIndex = 0;
                    loadSongMetadata(0);
                    highlightActiveSong(0);
                }
            }

            // Adiciona item visual na playlist
            function addPlaylistItem(index, item) {
                const li = document.createElement('li');
                li.dataset.index = index;
                const nameSpan = document.createElement('span');
                nameSpan.className = 'song-name';
                nameSpan.textContent = item.name;
                const durationSpan = document.createElement('span');
                durationSpan.className = 'song-duration';
                durationSpan.textContent = 'carregando...';
                li.appendChild(nameSpan);
                li.appendChild(durationSpan);
                playlistEl.appendChild(li);
                li.addEventListener('click', () => playSong(parseInt(li.dataset.index)));
            }

            // Carrega metadados (duração) sem tocar
            function loadMetadataForItem(item, index) {
                const tempAudio = new Audio();
                tempAudio.preload = 'metadata';
                tempAudio.src = item.url;
                tempAudio.addEventListener('loadedmetadata', function() {
                    item.duration = tempAudio.duration;
                    item.durationStr = formatTime(tempAudio.duration);
                    const li = playlistEl.children[index];
                    if (li) {
                        const durationSpan = li.querySelector('.song-duration');
                        if (durationSpan) durationSpan.textContent = item.durationStr;
                    }
                }, { once: true });
                // Fallback para quando o áudio não carregar
                tempAudio.addEventListener('error', function() {
                    item.durationStr = '0:00';
                    const li = playlistEl.children[index];
                    if (li) {
                        const durationSpan = li.querySelector('.song-duration');
                        if (durationSpan) durationSpan.textContent = '?';
                    }
                });
            }

            // Prepara a música (carrega no player) mas NÃO toca
            function loadSongMetadata(index) {
                if (playlist.length === 0 || index < 0 || index >= playlist.length) return;
                const item = playlist[index];
                audio.src = item.url;
                audio.load();
                songTitleEl.textContent = item.name;
                songArtistEl.textContent = item.isInternal ? '✦ app interno ✦' : '✦ selecionado ✦';
            }

            // Tocar música (acionado pelo clique na playlist ou botões next/prev)
            function playSong(index) {
                if (playlist.length === 0 || index < 0 || index >= playlist.length) return;
                const wasPlaying = isPlaying;
                audio.pause();
                currentIndex = index;
                loadSongMetadata(currentIndex);
                highlightActiveSong(currentIndex);
                if (wasPlaying) {
                    audio.play()
                        .then(() => {
                            isPlaying = true;
                            vinylDisc.classList.add('playing');
                            updatePlayPauseIcon();
                        })
                        .catch(e => console.log('Playback error:', e));
                } else {
                    isPlaying = false;
                    updatePlayPauseIcon();
                    vinylDisc.classList.remove('playing');
                }
                audio.volume = volumeSlider.value;
            }

            function highlightActiveSong(index) {
                Array.from(playlistEl.children).forEach((li, i) => {
                    li.classList.toggle('active', i === index);
                });
            }

            // ---------- CONTROLES DO PLAYER ----------
            function togglePlayPause() {
                if (playlist.length === 0 || currentIndex === -1) return;
                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                    vinylDisc.classList.remove('playing');
                } else {
                    audio.play()
                        .then(() => {
                            isPlaying = true;
                            vinylDisc.classList.add('playing');
                        })
                        .catch(e => console.log('Erro ao tocar:', e));
                }
                updatePlayPauseIcon();
            }

            function updatePlayPauseIcon() {
                const icon = playPauseBtn.querySelector('i');
                icon.className = isPlaying ? 'fas fa-pause' : 'fas fa-play';
            }

            function nextSong() {
                if (playlist.length === 0) return;
                let nextIdx = currentIndex + 1;
                if (nextIdx >= playlist.length) nextIdx = 0;
                playSong(nextIdx);
            }

            function prevSong() {
                if (playlist.length === 0) return;
                let prevIdx = currentIndex - 1;
                if (prevIdx < 0) prevIdx = playlist.length - 1;
                playSong(prevIdx);
            }

            function updateProgress() {
                if (audio.duration) {
                    const percent = (audio.currentTime / audio.duration) * 100;
                    progressBar.value = percent || 0;
                    currentTimeEl.textContent = formatTime(audio.currentTime);
                    durationTimeEl.textContent = formatTime(audio.duration);
                }
            }

            function seekAudio() {
                if (audio.duration) {
                    const seekTime = (progressBar.value / 100) * audio.duration;
                    audio.currentTime = seekTime;
                }
            }

            // ---------- ESCANEAMENTO DA PASTA (Cordova) ----------

            function loadMusicList() {

    if (typeof MUSIC_LIST === "undefined") {
        playlistEl.innerHTML = '<li class="empty-playlist">Erro: lista.js não encontrado</li>';
        return;
    }

    playlist = [];
    playlistEl.innerHTML = '';

    const sortedList = [...MUSIC_LIST].sort((a,b) => a.localeCompare(b));

    sortedList.forEach((fileName, idx) => {

        const url = "musicas/" + fileName;
        const songName = beautifyName(fileName);

        const item = {
            name: songName,
            url: url,
            duration: 0,
            durationStr: '0:00',
            isInternal: true
        };

        playlist.push(item);
        addPlaylistItem(idx, item);
        loadMetadataForItem(item, idx);
    });

    if (playlist.length > 0) {
        currentIndex = 0;
        loadSongMetadata(0);
        highlightActiveSong(0);
    }
}


            // ---------- EVENT LISTENERS ----------
            // Seleção manual de arquivos
            fileInput.addEventListener('change', function(e) {
                if (e.target.files.length) {
                    addFilesFromPicker(e.target.files);
                }
                fileInput.value = ''; // permite selecionar os mesmos arquivos novamente
            });

            // Controles
            playPauseBtn.addEventListener('click', togglePlayPause);
            nextBtn.addEventListener('click', nextSong);
            prevBtn.addEventListener('click', prevSong);
            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('ended', nextSong);
            progressBar.addEventListener('input', seekAudio);
            volumeSlider.addEventListener('input', function() {
                audio.volume = volumeSlider.value;
            });
            audio.addEventListener('loadedmetadata', function() {
                durationTimeEl.textContent = formatTime(audio.duration);
            });

            // Volume inicial
            audio.volume = 0.7;

// ---------- INICIALIZAÇÃO ----------
if (window.cordova) {
    document.addEventListener('deviceready', function() {
        console.log('Cordova pronto, carregando lista interna...');
        loadMusicList();
    }, false);
} else {
    loadMusicList();
}

})();   // <-- ISSO ESTAVA FALTANDO

</script>
</body>
</html>
